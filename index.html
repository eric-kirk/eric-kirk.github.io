    <style>

            position: relative;
            border-radius: 1rem;
            overflow: hidden;
            /* Subtle shadow to ground the interactive area */
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
            background: linear-gradient(to bottom right, #fafafa, #ffffff);
            border: 1px solid #f3f4f6;

            #canvas-container {
                /* Make it 50% wider than its 1/3 column container */
                width: 150%; 
                /* By keeping margin-right at 0, the flex-end alignment of the parent 
                   forces the canvas right-edge to align with the picture, pushing the extra 50% width leftwards */
                margin-right: 0; 
            }
        }
    </style>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // --- Three.js Interactive Neural Trajectory ---
        window.onload = function() {
            initNeuralVisualizer();
        };

        function initNeuralVisualizer() {
            const container = document.getElementById('canvas-container');
            if (!container || typeof THREE === 'undefined') return;

            // Setup Scene, Camera, Renderer
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfcfcfd); // Light grey background

            // Adjust aspect ratio based on container's computed size
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(20, 15, 30);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 1. Draw thin black axes perfectly centered
            const axesMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 1, transparent: true, opacity: 0.3 });
            const axisLength = 15;
            
            const xAxisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-axisLength, 0, 0), new THREE.Vector3(axisLength, 0, 0)]);
            const yAxisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -axisLength, 0), new THREE.Vector3(0, axisLength, 0)]);
            const zAxisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, -axisLength), new THREE.Vector3(0, 0, axisLength)]);
            
            scene.add(new THREE.Line(xAxisGeo, axesMaterial));
            scene.add(new THREE.Line(yAxisGeo, axesMaterial));
            scene.add(new THREE.Line(zAxisGeo, axesMaterial));

            // 2. Flow Field (Background context)
            const flowParticlesCount = 600;
            const flowGeometry = new THREE.BufferGeometry();
            const flowPositions = new Float32Array(flowParticlesCount * 3);
            const flowInitialPositions = new Float32Array(flowParticlesCount * 3);
            const flowPhases = new Float32Array(flowParticlesCount);

            for (let i = 0; i < flowParticlesCount; i++) {
                const r = 16 * Math.cbrt(Math.random());
                const theta = Math.random() * 2 * Math.PI;
                const phi = Math.acos(2 * Math.random() - 1);

                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta);
                const z = r * Math.cos(phi);

                flowPositions[i * 3] = x;
                flowPositions[i * 3 + 1] = y;
                flowPositions[i * 3 + 2] = z;

                flowInitialPositions[i * 3] = x;
                flowInitialPositions[i * 3 + 1] = y;
                flowInitialPositions[i * 3 + 2] = z;
                
                flowPhases[i] = Math.random() * Math.PI * 2;
            }

            flowGeometry.setAttribute('position', new THREE.BufferAttribute(flowPositions, 3));
            const flowMaterial = new THREE.PointsMaterial({ 
                color: 0xd1d5db, 
                size: 0.15,
                transparent: true,
                opacity: 0.7
            });
            const flowSystem = new THREE.Points(flowGeometry, flowMaterial);
            scene.add(flowSystem);

            // 3. Dynamic Neural Trajectory (Brilliant Green Line)
            const trajPointsCount = 200;
            const trajGeometry = new THREE.BufferGeometry();
            const trajPositions = new Float32Array(trajPointsCount * 3);
            trajGeometry.setAttribute('position', new THREE.BufferAttribute(trajPositions, 3));
            
            // Brilliant Green line for the active neural trajectory
            const trajMaterial = new THREE.LineBasicMaterial({ 
                color: 0x10b981, 
                linewidth: 2
            });
            const trajectoryLine = new THREE.Line(trajGeometry, trajMaterial);
            scene.add(trajectoryLine);

            // Physics variables
            let baseDt = 0.015;
            let currentX = 0.1, currentY = 0, currentZ = 0;
            const history = []; 
            const visualScale = 0.4; // Map math scale down to visual scale

            const mouse = new THREE.Vector2();
            const raycaster = new THREE.Raycaster();
            let isHovering = false;
            let targetAttraction = 0;
            let currentAttraction = 0;
            let pointerIntersectPoint = new THREE.Vector3();
            
            const planeGeo = new THREE.PlaneGeometry(100, 100);
            const planeMat = new THREE.MeshBasicMaterial({ visible: false });
            const interactionPlane = new THREE.Mesh(planeGeo, planeMat);
            interactionPlane.lookAt(camera.position);
            scene.add(interactionPlane);

            container.addEventListener('mousemove', (event) => {
                const rect = container.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / container.clientWidth) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / container.clientHeight) * 2 + 1;
                isHovering = true;
                targetAttraction = 1.0; 
            });

            container.addEventListener('mouseleave', () => {
                isHovering = false;
                targetAttraction = 0.0;
            });

            // Resizing intelligently adapts to the 2:1 aspect ratio constraint
            window.addEventListener('resize', () => {
                const width = container.clientWidth;
                const height = container.clientHeight;
                renderer.setSize(width, height);
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
            });

            let time = 0;
            
            function animate() {
                requestAnimationFrame(animate);
                time += 0.01;

                currentAttraction += (targetAttraction - currentAttraction) * 0.1;

                if (isHovering) {
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObject(interactionPlane);
                    if (intersects.length > 0) {
                        pointerIntersectPoint.copy(intersects[0].point);
                    }
                }

                // Smooth scene rotation
                scene.rotation.y = time * 0.2;
                interactionPlane.rotation.y = -scene.rotation.y;

                // Update Flow Field (Grey Particles Swirling)
                const positions = flowGeometry.attributes.position.array;
                for (let i = 0; i < flowParticlesCount; i++) {
                    const idx = i * 3;
                    
                    let px = flowInitialPositions[idx] + Math.sin(time * 2 + flowPhases[i]) * 0.2;
                    let py = flowInitialPositions[idx+1] + Math.cos(time * 1.5 + flowPhases[i]) * 0.2;
                    let pz = flowInitialPositions[idx+2] + Math.sin(time * 1.8 + flowPhases[i]) * 0.2;

                    // When hovered, particles SWIRL and RIPPLE into a circular orbit around the pointer
                    if (currentAttraction > 0.01) {
                        const particleWorldPos = new THREE.Vector3(px, py, pz);
                        particleWorldPos.applyAxisAngle(new THREE.Vector3(0,1,0), scene.rotation.y);
                        
                        const toParticle = new THREE.Vector3().subVectors(particleWorldPos, pointerIntersectPoint);
                        const dist = toParticle.length();
                        
                        const influenceRadius = 35;
                        if (dist < influenceRadius) {
                            // Quadratic falloff based on distance
                            const forceMag = Math.pow(1 - (dist / influenceRadius), 2) * currentAttraction;
                            
                            // 1. Pull inward
                            const radialForce = toParticle.clone().normalize().multiplyScalar(-10.0 * forceMag);
                            
                            // 2. Swirl tangentially around the Z-axis
                            const zAxis = new THREE.Vector3(0, 0, 1);
                            let tangentialForce = new THREE.Vector3().crossVectors(toParticle, zAxis).normalize().multiplyScalar(15.0 * forceMag);
                            if (isNaN(tangentialForce.x)) tangentialForce.set(0,0,0);
                            
                            // 3. Very small amplitude, high-frequency ripple along the Z-axis for particles
                            const zRippleForce = new THREE.Vector3(0, 0, Math.sin(time * 90.0 + dist) * 1.5 * forceMag);
                            
                            // Combine physical forces
                            const totalForce = new THREE.Vector3().addVectors(radialForce, tangentialForce).add(zRippleForce);
                            
                            // Transform force back into the local rotated space
                            totalForce.applyAxisAngle(new THREE.Vector3(0,1,0), -scene.rotation.y);
                            
                            px += totalForce.x * 0.15;
                            py += totalForce.y * 0.15;
                            pz += totalForce.z * 0.15;
                        }
                    }

                    positions[idx] = px;
                    positions[idx+1] = py;
                    positions[idx+2] = pz;
                }
                flowGeometry.attributes.position.needsUpdate = true;

                const sigma = 10;
                const rho = 28;
                const beta = 8/3;
                
                // Introduce variable velocity: speed speeds up and slows down dynamically based on time
                const velocityMultiplier = 1.2 + 0.9 * Math.sin(time * 1.5); // Oscillates between 0.3x (slow) and 2.1x (fast)
                const currentDt = baseDt * velocityMultiplier;
                
                // Native dynamics utilizing variable velocity
                let dx = sigma * (currentY - currentX) * currentDt;
                let dy = (currentX * (rho - currentZ) - currentY) * currentDt;
                let dz = (currentX * currentY - beta * currentZ) * currentDt;

                // CIRCULAR ATTRACTOR LOGIC
                if (currentAttraction > 0.01) {
                    const localPointer = pointerIntersectPoint.clone();
                    localPointer.applyAxisAngle(new THREE.Vector3(0,1,0), -scene.rotation.y);
                    
                    // Map visual target back to the mathematical state space, maintaining perfect origin centering
                    const baseTargetX = localPointer.x / visualScale;
                    const baseTargetY = localPointer.y / visualScale;
                    const baseTargetZ = (localPointer.z / visualScale) + 28; 

                    // 1. Rotate around X and Y axes
                    const orbitRadius = 18.0;
                    const orbitSpeed = 12.0;
                    
                    // 2. High frequency, VERY small amplitude variability along the Z axis
                    const rippleFreq = 90.0;
                    const rippleAmp = 1.0;
                    
                    // Generate the dynamically moving circular target point
                    const targetStateX = baseTargetX + Math.cos(time * orbitSpeed) * orbitRadius;
                    const targetStateY = baseTargetY + Math.sin(time * orbitSpeed) * orbitRadius;
                    const targetStateZ = baseTargetZ + Math.sin(time * rippleFreq) * rippleAmp;

                    // Apply overwhelming pull to collapse trajectory into the new circular limit-cycle
                    const pullStrength = 60 * currentAttraction; 
                    
                    // The pull also respects the variable velocity for smooth integration
                    dx += (targetStateX - currentX) * pullStrength * currentDt;
                    dy += (targetStateY - currentY) * pullStrength * currentDt;
                    dz += (targetStateZ - currentZ) * pullStrength * currentDt;
                }

                currentX += dx;
                currentY += dy;
                currentZ += dz;

                // Centered rendering mapping: Subtract 28 from Lorenz Z to center perfectly around (0,0,0)
                const visualX = currentX * visualScale;
                const visualY = currentY * visualScale;
                const visualZ = (currentZ - 28) * visualScale;

                history.push(new THREE.Vector3(visualX, visualY, visualZ));
                if (history.length > trajPointsCount) history.shift();

                const tPositions = trajGeometry.attributes.position.array;
                for (let i = 0; i < trajPointsCount; i++) {
                    const hIndex = i - (trajPointsCount - history.length);
                    if (hIndex >= 0 && hIndex < history.length) {
                        const pt = history[hIndex];
                        tPositions[i*3] = pt.x;
                        tPositions[i*3+1] = pt.y;
                        tPositions[i*3+2] = pt.z;
                    } else {
                        const pt = history.length > 0 ? history[0] : new THREE.Vector3(0,0,0);
                        tPositions[i*3] = pt.x;
                        tPositions[i*3+1] = pt.y;
                        tPositions[i*3+2] = pt.z;
                    }
                }
                
                trajGeometry.attributes.position.needsUpdate = true;
                renderer.render(scene, camera);
            }

            animate();
        }
    </script>
