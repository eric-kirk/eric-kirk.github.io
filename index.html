    <script>
        lucide.createIcons();

        window.onload = function() {
            initNeuralVisualizer();
        };

        function initNeuralVisualizer() {
            const container = document.getElementById('canvas-container');
            if (!container || typeof THREE === 'undefined') return;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfcfcfd); 

            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(15, 12, 25);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Thin, subtle black axes centered at 0
            const axesMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 1, transparent: true, opacity: 0.25 });
            const axisLength = 12;
            
            const xAxisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-axisLength, 0, 0), new THREE.Vector3(axisLength, 0, 0)]);
            const yAxisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -axisLength, 0), new THREE.Vector3(0, axisLength, 0)]);
            const zAxisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, -axisLength), new THREE.Vector3(0, 0, axisLength)]);
            
            scene.add(new THREE.Line(xAxisGeo, axesMaterial));
            scene.add(new THREE.Line(yAxisGeo, axesMaterial));
            scene.add(new THREE.Line(zAxisGeo, axesMaterial));

            // Flow Field (Grey particles)
            const flowParticlesCount = 500;
            const flowGeometry = new THREE.BufferGeometry();
            const flowPositions = new Float32Array(flowParticlesCount * 3);

            for (let i = 0; i < flowParticlesCount; i++) {
                // Initialize in a sphere around origin
                const r = 12 * Math.cbrt(Math.random());
                const theta = Math.random() * 2 * Math.PI;
                const phi = Math.acos(2 * Math.random() - 1);

                flowPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                flowPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                flowPositions[i * 3 + 2] = r * Math.cos(phi);
            }

            flowGeometry.setAttribute('position', new THREE.BufferAttribute(flowPositions, 3));
            const flowMaterial = new THREE.PointsMaterial({ 
                color: 0xcbced4, 
                size: 0.15,
                transparent: true,
                opacity: 0.6
            });
            const flowSystem = new THREE.Points(flowGeometry, flowMaterial);
            scene.add(flowSystem);

            // Dynamic Neural Trajectory (Brilliant Green)
            const trajPointsCount = 200;
            const trajGeometry = new THREE.BufferGeometry();
            const trajPositions = new Float32Array(trajPointsCount * 3);
            trajGeometry.setAttribute('position', new THREE.BufferAttribute(trajPositions, 3));
            
            const trajMaterial = new THREE.LineBasicMaterial({ 
                color: 0x10b981, // Brilliant emerald green
                linewidth: 2
            });
            const trajectoryLine = new THREE.Line(trajGeometry, trajMaterial);
            scene.add(trajectoryLine);

            // Math state tracking
            const visualScale = 0.5; // Scales the math space to visual space
            let currentX = 2.0, currentY = 0.0, currentZ = 0.0;
            const history = []; 
            
            // Interaction tracking
            const mouse = new THREE.Vector2();
            const raycaster = new THREE.Raycaster();
            let isHovering = false;
            let currentAttraction = 0;
            let targetAttraction = 0;
            let pointerIntersectPoint = new THREE.Vector3();
            
            const planeGeo = new THREE.PlaneGeometry(100, 100);
            const planeMat = new THREE.MeshBasicMaterial({ visible: false });
            const interactionPlane = new THREE.Mesh(planeGeo, planeMat);
            interactionPlane.lookAt(camera.position);
            scene.add(interactionPlane);

            container.addEventListener('mousemove', (event) => {
                const rect = container.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / container.clientWidth) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / container.clientHeight) * 2 + 1;
                isHovering = true;
                targetAttraction = 1.0; 
            });

            container.addEventListener('mouseleave', () => {
                isHovering = false;
                targetAttraction = 0.0;
            });

            window.addEventListener('resize', () => {
                const width = container.clientWidth;
                const height = container.clientHeight;
                renderer.setSize(width, height);
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
            });

            let time = 0;
            const dt = 0.015; // Fixed time-step for smooth, stable numerical integration
            
            function getVectorField(x, y, z, t, attraction, targetX, targetY, targetZ) {
                // Determine phase for continuously morphing between 3 dynamical systems
                const stateTime = (t * 0.2) % 3.0; 
                
                let w1 = Math.max(0, 1.0 - Math.abs(stateTime - 0.0));
                if (stateTime > 2.0) w1 = Math.max(w1, stateTime - 3.0 + 1.0); // Wrap around
                let w2 = Math.max(0, 1.0 - Math.abs(stateTime - 1.0));
                let w3 = Math.max(0, 1.0 - Math.abs(stateTime - 2.0));
                
                // System 1: Ring Attractor (Stable Limit Cycle)
                const r_xy = Math.sqrt(x*x + y*y);
                const ringRadius = 10.0;
                const ring_dx = -y * 3.0 + x * (ringRadius - r_xy) * 1.5;
                const ring_dy =  x * 3.0 + y * (ringRadius - r_xy) * 1.5;
                const ring_dz = -z * 3.0; // pulls tightly to Z=0

                // System 2: 3D Oscillator (Lissajous-style orbits)
                const osc_dx = y * 4.0 + Math.sin(z) * 2.0;
                const osc_dy = -x * 3.0 - y * 0.1; 
                const osc_dz = Math.sin(x * 0.5) * 8.0 - z * 0.2;

                // System 3: Bounded Repeller (Pushes out from origin, catches at shell)
                const r = Math.sqrt(x*x + y*y + z*z);
                const shell = 12.0;
                const force = (shell - r) * 1.5; 
                const rep_dx = x * force + y * 6.0 + z * 2.0;
                const rep_dy = y * force - x * 6.0;
                const rep_dz = z * force - x * 2.0;

                // Blend the unhovered systems smoothly
                let dX = ring_dx * w1 + osc_dx * w2 + rep_dx * w3;
                let dY = ring_dy * w1 + osc_dy * w2 + rep_dy * w3;
                let dZ = ring_dz * w1 + osc_dz * w2 + rep_dz * w3;

                // Override with Hover Dynamics (Unstable Fixed Point)
                if (attraction > 0.01) {
                    const dx_pull = targetX - x;
                    const dy_pull = targetY - y;
                    const dz_pull = targetZ - z;
                    const dist = Math.sqrt(dx_pull*dx_pull + dy_pull*dy_pull + dz_pull*dz_pull) + 0.001;
                    
                    // Instability scales up exponentially as it gets closer to the fixed point
                    let instability = Math.max(0, 1.0 - (dist / 15.0));
                    instability = Math.pow(instability, 2.0); 
                    
                    // Massive pull force collapsing the trajectory
                    const pull_force = 18.0;
                    
                    // Chaotic, high-frequency "bounce" logic
                    // We use intersecting high-frequency waves so it looks erratic but continuous
                    const bounceX = (Math.sin(t * 45) * Math.cos(t * 37) + Math.sin(t * 105)*0.5) * 80.0;
                    const bounceY = (Math.cos(t * 41) * Math.sin(t * 31) + Math.cos(t * 115)*0.5) * 80.0;
                    const bounceZ = (Math.sin(t * 53) * Math.cos(t * 43) + Math.sin(t * 125)*0.5) * 80.0;
                    
                    // A tiny repulsive core prevents it from ever completely resting
                    const coreRepel = 25.0 / (dist * dist + 0.1);

                    const hX = dx_pull * pull_force - (dx_pull/dist) * coreRepel + bounceX * instability;
                    const hY = dy_pull * pull_force - (dy_pull/dist) * coreRepel + bounceY * instability;
                    const hZ = dz_pull * pull_force - (dz_pull/dist) * coreRepel + bounceZ * instability;
                    
                    dX = dX * (1 - attraction) + hX * attraction;
                    dY = dY * (1 - attraction) + hY * attraction;
                    dZ = dZ * (1 - attraction) + hZ * attraction;
                }
                
                // Prevent extreme numerical explosions
                const maxVel = 150.0;
                return {
                    dx: Math.max(-maxVel, Math.min(maxVel, dX)),
                    dy: Math.max(-maxVel, Math.min(maxVel, dY)),
                    dz: Math.max(-maxVel, Math.min(maxVel, dZ))
                };
            }

            function animate() {
                requestAnimationFrame(animate);
                time += dt;

                currentAttraction += (targetAttraction - currentAttraction) * 0.1;

                if (isHovering) {
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObject(interactionPlane);
                    if (intersects.length > 0) {
                        pointerIntersectPoint.copy(intersects[0].point);
                    }
                }

                // Slowly rotate scene for 3D effect
                scene.rotation.y = time * 0.15;
                interactionPlane.rotation.y = -scene.rotation.y;

                // Prepare target coordinates in math-space
                let targetX = 0, targetY = 0, targetZ = 0;
                if (currentAttraction > 0.01) {
                    const localPointer = pointerIntersectPoint.clone();
                    localPointer.applyAxisAngle(new THREE.Vector3(0,1,0), -scene.rotation.y);
                    targetX = localPointer.x / visualScale;
                    targetY = localPointer.y / visualScale;
                    targetZ = localPointer.z / visualScale;
                }

                // 1. Update Continuous Green Trajectory
                const vField = getVectorField(currentX, currentY, currentZ, time, currentAttraction, targetX, targetY, targetZ);
                currentX += vField.dx * dt;
                currentY += vField.dy * dt;
                currentZ += vField.dz * dt;

                const visualX = currentX * visualScale;
                const visualY = currentY * visualScale;
                const visualZ = currentZ * visualScale;

                history.push(new THREE.Vector3(visualX, visualY, visualZ));
                if (history.length > trajPointsCount) history.shift();

                const tPositions = trajGeometry.attributes.position.array;
                for (let i = 0; i < trajPointsCount; i++) {
                    const hIndex = i - (trajPointsCount - history.length);
                    const pt = (hIndex >= 0 && hIndex < history.length) ? history[hIndex] : (history.length > 0 ? history[0] : new THREE.Vector3(0,0,0));
                    tPositions[i*3] = pt.x;
                    tPositions[i*3+1] = pt.y;
                    tPositions[i*3+2] = pt.z;
                }
                trajGeometry.attributes.position.needsUpdate = true;

                // 2. Update Flow Field Particles (They evaluate the exact same dynamical systems!)
                const pPositions = flowGeometry.attributes.position.array;
                for (let i = 0; i < flowParticlesCount; i++) {
                    const idx = i * 3;
                    
                    let mx = pPositions[idx] / visualScale;
                    let my = pPositions[idx+1] / visualScale;
                    let mz = pPositions[idx+2] / visualScale;

                    // Each particle integrates the vector field independently based on its position
                    const pField = getVectorField(mx, my, mz, time, currentAttraction, targetX, targetY, targetZ);
                    
                    mx += pField.dx * dt;
                    my += pField.dy * dt;
                    mz += pField.dz * dt;

                    // Keep particles contained within a bounding volume if they stray too far
                    if (Math.sqrt(mx*mx + my*my + mz*mz) > 25.0) {
                        mx = (Math.random() - 0.5) * 15.0;
                        my = (Math.random() - 0.5) * 15.0;
                        mz = (Math.random() - 0.5) * 15.0;
                    }

                    pPositions[idx] = mx * visualScale;
                    pPositions[idx+1] = my * visualScale;
                    pPositions[idx+2] = mz * visualScale;
                }
                flowGeometry.attributes.position.needsUpdate = true;

                renderer.render(scene, camera);
            }

            animate();
        }
    </script>
